plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'ysm-epicfight-compat'
}

def ysmMappingApiDependencyVersion = gradle.ext.ysmMappingApiDependencyVersion

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    addModdingDependenciesTo sourceSets.test
}

repositories {
    mavenCentral()
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

// Configured has no 1.21.1 NeoForge distribution; its display-only integration
// is excluded on this branch. TOML configuration remains fully functional.
sourceSets.main.java.exclude 'net/okitsu/ysmepicfightcompat/integration/configured/**'
sourceSets.main.java.exclude 'net/okitsu/ysmepicfightcompat/mixin/ConfiguredForgeConfigMixin.java'
sourceSets.main.java.exclude 'net/okitsu/ysmepicfightcompat/mixin/ConfiguredForgeFolderEntryMixin.java'
sourceSets.test.java.exclude 'net/okitsu/ysmepicfightcompat/integration/configured/**'

dependencies {
    implementation "maven.modrinth:epic-fight:${epicfight_version}"
    compileOnly "net.okitsu.ysmmapping:api:${ysmMappingApiDependencyVersion}"

    implementation 'com.github.luben:zstd-jni:1.5.6-3'
    jarJar 'com.github.luben:zstd-jni:1.5.6-3'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testCompileOnly "net.okitsu.ysmmapping:api:${ysmMappingApiDependencyVersion}"
    testRuntimeOnly "net.okitsu.ysmmapping:api:${ysmMappingApiDependencyVersion}"
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            ysm_version_range: ysm_version_range,
            epicfight_version_range: epicfight_version_range,
            ysm_mapping_api_version_range: ysm_mapping_api_version_range,
            touhou_little_maid_version_range: touhou_little_maid_version_range,
            epicfight_touhou_little_maid_version_range:
                    epicfight_touhou_little_maid_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(Jar).configureEach {
    archiveVersion = "mc${minecraft_version}-${mod_version}"
}

tasks.register('verifyDistributions') {
    dependsOn 'jar'
    doLast {
        def archive = tasks.named('jar', Jar).get().archiveFile.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            ['META-INF/neoforge.mods.toml', 'META-INF/ysm-mapping-api/requests-v1.json',
             'ysm_epicfight_compat.mixins.json',
             'net/okitsu/ysmepicfightcompat/CompatMod.class',
             'net/okitsu/ysmepicfightcompat/integration/tlm/TouhouMaidSelectionAccess.class',
             'net/okitsu/ysmepicfightcompat/integration/tlm/TouhouMaidAnimationStateAccess.class',
             'net/okitsu/ysmepicfightcompat/integration/tlm/TouhouMaidRenderBridge.class',
             'net/okitsu/ysmepicfightcompat/mixin/PatchedLivingEntityRendererMixin.class',
             'net/okitsu/ysmepicfightcompat/mixin/TouhouMaidAnimationStateMixin.class',
             'net/okitsu/ysmepicfightcompat/mixin/TouhouMaidRendererMixin.class',
             'assets/ysm_epicfight_compat/lang/en_us.json',
             'assets/ysm_epicfight_compat/lang/ja_jp.json'].each { entry ->
                if (zip.getEntry(entry) == null) {
                    throw new GradleException("Distribution is missing ${entry}")
                }
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xmaxerrs' << '10000'
}
